<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Central RTC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23D7EE02' stroke='%231A2A66' stroke-width='3'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%231A2A66' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="fontes/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="login.js"></script>
</head>
<body class="pagina-entrada">
  <main class="entrada">
    <div class="marca">
      <span class="marca-nome">Central RTC</span>
      <span class="marca-sub">Calculadoras da reforma tributária e DANFSe, num lugar só</span>
    </div>

    <form id="form-entrar" novalidate>
      <h1>Entrar</h1>
      <div class="ficha">
        <label class="campo campo-largo"><span>E-mail ou usuário</span>
          <input name="usuario" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </label>
        <label class="campo campo-largo"><span>Senha</span>
          <input name="senha" type="password" autocomplete="current-password" required>
        </label>
      </div>
      <div class="opcoes-senha">
        <label class="mostrar-senha"><input type="checkbox"> Mostrar senha</label>
        <a id="link-esqueci" href="#" hidden>Esqueceu a senha?</a>
      </div>
      <div id="erro-entrar" class="mensagem mensagem-erro" role="alert" hidden></div>
      <div class="acoes">
        <button type="submit" class="botao botao-principal">Entrar</button>
        <a class="botao" href="cadastro.html">Criar conta</a>
      </div>
    </form>

    <nav class="entrada-links" aria-label="Ajuda">
      <a href="https://pedroshttps.github.io/central-rtc/guia.html" target="_blank" rel="noopener">Guia de uso</a>
      <a id="link-ajuda" href="#" hidden>Contatar suporte</a>
      <a href="https://pedroshttps.github.io/central-rtc/privacidade.html" target="_blank" rel="noopener">Privacidade (LGPD)</a>
    </nav>
  </main>
</body>
</html>
