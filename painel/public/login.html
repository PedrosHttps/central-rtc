<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Central RTC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%235A2D82' stroke-width='3'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%2315253A' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="fontes/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="login.js"></script>
</head>
<body class="pagina-entrada">
  <main class="entrada">
    <div class="marca">
      <span class="marca-nome">Central RTC</span>
      <span class="marca-sub">Calculadoras da reforma tributária e DANFSe, num lugar só</span>
    </div>

    <form id="form-entrar" novalidate>
      <h1>Entrar</h1>
      <div class="ficha">
        <label class="campo campo-largo"><span>E-mail ou usuário</span>
          <input name="usuario" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </label>
        <label class="campo campo-largo"><span>Senha</span>
          <input name="senha" type="password" autocomplete="current-password" required>
        </label>
      </div>
      <div id="erro-entrar" class="mensagem mensagem-erro" role="alert" hidden></div>
      <div class="acoes">
        <button type="submit" class="botao botao-principal">Entrar</button>
      </div>
    </form>

    <div id="entrar-google" hidden>
      <p class="ou"><span>ou</span></p>
      <a class="botao botao-google" href="/api/google/entrar">Entrar com Google</a>
    </div>

    <p class="nota">Ainda não tem conta? <a href="cadastro.html">Criar conta</a>. O acesso é liberado depois de uma análise do pedido.</p>
    <p id="pedir-acesso" class="nota" hidden>Dúvidas? <a id="link-pedir-acesso" href="#">Escreva para o administrador</a>.</p>
  </main>
</body>
</html>
