<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Central RTC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%235A2D82' stroke-width='3'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%2315253A' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="fontes/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="cadastro.js"></script>
</head>
<body class="pagina-entrada">
  <main class="entrada">
    <div class="marca">
      <span class="marca-nome">Central RTC</span>
      <span class="marca-sub">Calculadoras da reforma tributária e DANFSe, num lugar só</span>
    </div>

    <form id="form-cadastro" novalidate>
      <h1>Criar conta</h1>
      <p id="explica" class="nota">Seu pedido passa por uma análise. Quando for aprovado, você entra com o e-mail e a senha que escolher aqui.</p>
      <div class="ficha">
        <label class="campo campo-largo"><span>Nome</span>
          <input name="nome" autocomplete="name" maxlength="100" required>
        </label>
        <label class="campo campo-largo"><span>E-mail (vira o seu usuário)</span>
          <input name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" required>
        </label>
        <label class="campo campo-largo"><span>Empresa</span>
          <input name="empresa" autocomplete="organization" maxlength="100">
        </label>
        <label class="campo campo-largo"><span>Para que você vai usar a ferramenta?</span>
          <input name="motivo" autocomplete="off" maxlength="500" required>
        </label>
        <label class="campo campo-largo" data-senha><span>Senha (12 caracteres ou mais)</span>
          <input name="senha" type="password" autocomplete="new-password" required>
        </label>
        <label class="campo campo-largo" data-senha><span>Repita a senha</span>
          <input name="repetida" type="password" autocomplete="new-password" required>
        </label>
      </div>
      <div id="msg-cadastro" class="mensagem" role="status" hidden></div>
      <div class="acoes">
        <button type="submit" class="botao botao-principal">Pedir acesso</button>
      </div>
    </form>

    <div id="cadastro-google" hidden>
      <p class="ou"><span>ou</span></p>
      <a class="botao botao-google" href="/api/google/entrar">Criar conta com Google</a>
    </div>

    <p class="nota">Já tem conta? <a href="login.html">Entrar</a>.</p>
  </main>
</body>
</html>
